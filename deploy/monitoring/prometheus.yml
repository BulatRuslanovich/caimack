global:
  scrape_interval: 15s
  evaluation_interval: 30s

storage:
  tsdb:
    retention:
      time: 30d

rule_files:
  - recording-rules.yml

scrape_configs:
  - job_name: caimack-host
    static_configs:
      - targets: [host.docker.internal:19100]
        labels:
          instance: caimack-linux

  - job_name: caimack-health
    metrics_path: /probe
    params:
      module: [caimack_https]
    file_sd_configs:
      - files: [/etc/prometheus/health-target.yml]
    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [__param_target]
        target_label: instance
      - target_label: __address__
        replacement: blackbox:9115
