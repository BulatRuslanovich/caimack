name: Android release
run-name: Android ${{ inputs.release_tag || github.ref_name }}

on:
  push:
    tags: ["v*"]
  
  # INFO: U can trigger workflow manually in github
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Existing release tag to rebuild (for example v1.2.3)"
        required: true
        type: string
      include_desktop:
        description: Also build the desktop packages for this tag
        default: false
        type: boolean

permissions:
  contents: write

concurrency:
  group: android-release-${{ inputs.release_tag || github.ref_name }}

  # INFO: Not cancel workflow if tag is pushed again
  cancel-in-progress: false

jobs:
  desktop:
    if: github.event_name == 'push' || inputs.include_desktop
    uses: ./.github/workflows/desktop-release.yml
    with:
      release_tag: ${{ inputs.release_tag || github.ref_name }}

  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    outputs:
      revision: ${{ steps.metadata.outputs.revision }}
    env:
      RELEASE_TAG: ${{ inputs.release_tag || github.ref_name }}
    
    steps:
      - name: Validate release tag
        run: |
          if [[ ! "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Release tag must have the form v1.2.3."
            exit 1
          fi
      
      # INFO: Download the source code at the release tag
      - uses: actions/checkout@v7
        with:
          ref: refs/tags/${{ env.RELEASE_TAG }}
      
      - name: Validate version and restore release signing key
        id: metadata
        env:
          CAIMACK_KEYSTORE_BASE64: ${{ secrets.CAIMACK_KEYSTORE_BASE64 }}
          CAIMACK_KEYSTORE_PASSWORD: ${{ secrets.CAIMACK_KEYSTORE_PASSWORD }}
          CAIMACK_KEY_ALIAS: ${{ secrets.CAIMACK_KEY_ALIAS }}
          CAIMACK_KEY_PASSWORD: ${{ secrets.CAIMACK_KEY_PASSWORD }}
        run: |
          python3 - <<'PY'
          import base64, binascii, json, os, re, subprocess
          from pathlib import Path

          # INFO: Read the version from frontend/package.json
          version = json.loads(Path('frontend/package.json').read_text())['version']


          if not re.fullmatch(r'[0-9]+\.[0-9]+\.[0-9]+', version) or os.environ['RELEASE_TAG'] != f'v{version}':
              raise SystemExit('Release tag must match frontend/package.json (for example v1.2.3).')
            
          # INFO: List of required secrets for signing the release APK
          required = ['CAIMACK_KEYSTORE_BASE64', 'CAIMACK_KEYSTORE_PASSWORD', 'CAIMACK_KEY_ALIAS', 'CAIMACK_KEY_PASSWORD']

          missing = [name for name in required if not os.environ.get(name)]


          if missing:
              raise SystemExit('Missing repository secrets: ' + ', '.join(missing))
          
          try:
              # INFO: Decode the base64-encoded release keystore
              key = base64.b64decode(''.join(os.environ['CAIMACK_KEYSTORE_BASE64'].split()), validate=True)
          except (ValueError, binascii.Error):
              raise SystemExit('CAIMACK_KEYSTORE_BASE64 is not valid base64.') from None
            
          if not key:
              raise SystemExit('The release keystore is empty.')
          
          # INFO: Resolve the source commit for the release tag
          revision = subprocess.check_output(['git', 'rev-parse', 'HEAD'], text=True).strip()


          if not re.fullmatch(r'[a-fA-F0-9]{40}', revision):
              raise SystemExit('Could not resolve the release source commit.')
          
          # INFO: Set private permissions for the keystore file
          os.umask(0o077)

          # INFO: Save key to a temporary file
          target = Path(os.environ['RUNNER_TEMP']) / 'caimack-release.jks'
          target.write_bytes(key)

          # INFO: Export environment variables for the next steps
          with open(os.environ['GITHUB_ENV'], 'a') as output:
              output.write(f'CAIMACK_KEYSTORE_FILE={target}\nAPK_NAME=caimack-v{version}-arm64.apk\nSOURCE_REVISION={revision}\n')
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              output.write(f'revision={revision}\n')
          PY

      # INFO: Setup Java
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "25"
      
      # INFO: Setup Android SDK
      - uses: android-actions/setup-android@v4
        with:
          packages: "platform-tools platforms;android-37.0 build-tools;36.0.0"
      
      # INFO: Setup Gradle
      - uses: gradle/actions/setup-gradle@v6
        with:
          cache-provider: basic

      - name: Test and build signed release APK
        working-directory: android
        env:
          CAIMACK_KEYSTORE_PASSWORD: ${{ secrets.CAIMACK_KEYSTORE_PASSWORD }}
          CAIMACK_KEY_ALIAS: ${{ secrets.CAIMACK_KEY_ALIAS }}
          CAIMACK_KEY_PASSWORD: ${{ secrets.CAIMACK_KEY_PASSWORD }}
          CAIMACK_SOURCE_URL: https://github.com/${{ github.repository }}/tree/${{ env.SOURCE_REVISION }}
          CAIMACK_UPDATE_REPOSITORY: ${{ github.repository }}
        # INFO: Run unit tests
        # --no-daemon: not to use the Gradle daemon
        # --no-configuration-cache: not to use the Gradle configuration cache
        run: ./gradlew :app:testDebugUnitTest :app:assembleRelease --no-daemon --no-configuration-cache

      - name: Verify signature and prepare artifact
        run: |
          # INFO: Verify the APK signature
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose android/app/build/outputs/apk/release/app-release.apk

          mkdir -p dist
          cp android/app/build/outputs/apk/release/app-release.apk "dist/$APK_NAME"
      
      # INFO: Upload the signed APK as an artifact
      - uses: actions/upload-artifact@v7
        with:
          name: caimack-android-${{ env.RELEASE_TAG }} 
          path: dist/*.apk
          if-no-files-found: error
          retention-days: 30

      - name: Remove signing key
        if: always()
        run: rm -f -- "$RUNNER_TEMP/caimack-release.jks"

  publish:
    needs: [apk, desktop]
    if: ${{ !cancelled() && needs.apk.result == 'success' && (needs.desktop.result == 'success' || needs.desktop.result == 'skipped') }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      RELEASE_TAG: ${{ inputs.release_tag || github.ref_name }}
      APK_NAME: caimack-${{ inputs.release_tag || github.ref_name }}-arm64.apk
      SOURCE_REVISION: ${{ needs.apk.outputs.revision }}
    steps:
      - name: Check out tagged source
        uses: actions/checkout@v7
        with:
          ref: ${{ env.SOURCE_REVISION }}
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/download-artifact@v7
        with:
          name: caimack-android-${{ env.RELEASE_TAG }}
          path: dist

      - uses: actions/download-artifact@v7
        if: needs.desktop.result == 'success'
        with:
          pattern: caimack-desktop-*-${{ env.RELEASE_TAG }}
          path: dist/desktop

      - name: Check out release publishing tools
        uses: actions/checkout@v7
        with:
          ref: ${{ github.workflow_sha }}
          path: .release-tools
          sparse-checkout: |
            scripts/publish_android_release.py
            scripts/release_notes.py
          sparse-checkout-cone-mode: false
          persist-credentials: false

      - name: Prepare GitHub release and stage desktop packages
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          INCLUDE_DESKTOP: ${{ needs.desktop.result == 'success' }}
        run: |
          assets=()
          if [[ "$INCLUDE_DESKTOP" == true ]]; then
            mapfile -d '' assets < <(find dist/desktop -type f -print0 | sort -z)
            if [[ ${#assets[@]} -ne 6 ]]; then
              echo '::error::Expected two Windows and four Linux packages.'
              exit 1
            fi
          fi

          existing_assets="$RUNNER_TEMP/existing-release-assets"
          lookup_error="$RUNNER_TEMP/release-lookup-error"
          if gh release view "$RELEASE_TAG" --json assets --jq '.assets[] | select(.size > 0) | .name' > "$existing_assets" 2> "$lookup_error"; then
            for asset in "${assets[@]}"; do
              if ! grep -Fxq -- "${asset##*/}" "$existing_assets"; then
                gh release upload "$RELEASE_TAG" "$asset" --clobber
              fi
            done
          elif grep -Fxq 'release not found' "$lookup_error"; then
            notes="$RUNNER_TEMP/release-notes.md"
            python3 .release-tools/scripts/release_notes.py "$RELEASE_TAG" --repository "$GH_REPO" > "$notes"
            gh release create "$RELEASE_TAG" "${assets[@]}" --draft --verify-tag --notes-file "$notes" \
              --title "Caimack ${RELEASE_TAG#v}"
          else
            cat "$lookup_error" >&2
            exit 1
          fi
          release_id=$(gh release view "$RELEASE_TAG" --json databaseId --jq .databaseId)
          [[ "$release_id" =~ ^[1-9][0-9]*$ ]]
          echo "id=$release_id" >> "$GITHUB_OUTPUT"

      - name: Publish APK to GitHub Releases
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_REPOSITORY: ${{ github.repository }}
          RELEASE_ID: ${{ steps.release.outputs.id }}
        run: |
          python3 .release-tools/scripts/publish_android_release.py --apk "dist/$APK_NAME" \
            --tag "$RELEASE_TAG" --repository "$SOURCE_REPOSITORY" --release-id "$RELEASE_ID"

      - name: Send APK to the configured Telegram group
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          SOURCE_REPOSITORY: ${{ github.repository }}
        run: |
          python3 scripts/send_telegram_apk.py --apk "dist/$APK_NAME" \
            --tag "$RELEASE_TAG" --repository "$SOURCE_REPOSITORY" --revision "$SOURCE_REVISION"
