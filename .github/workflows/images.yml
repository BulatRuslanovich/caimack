name: Images

on:
  push:
    tags: ["v*"]

permissions:
  contents: read
  packages: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  image:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: backend
            context: backend
            file: backend/Dockerfile
            target: runtime
            contexts: db=db
          - name: frontend
            context: frontend
            file: frontend/Dockerfile
            target: runtime
            contexts: ""
          - name: mert
            context: backend/scripts
            file: backend/scripts/Dockerfile.mert
            target: runtime
            contexts: ""
          - name: mert-rocm
            context: backend/scripts
            file: backend/scripts/Dockerfile.mert
            target: runtime
            contexts: ""
            build_args: TORCH_INDEX_URL=https://download.pytorch.org/whl/rocm6.4
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v7
        with:
          node-version: "24"

      - name: Check image inputs against the previous release
        id: plan
        env:
          COMPONENT: ${{ matrix.name }}
        run: node scripts/image-plan.mjs "$COMPONENT"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: owner
        run: echo "name=${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_OUTPUT"

      - name: Find the unchanged image in the registry
        id: reuse
        if: steps.plan.outputs.source_tag != ''
        env:
          IMAGE: ghcr.io/${{ steps.owner.outputs.name }}/caimack-${{ matrix.name }}
          SOURCE_TAG: ${{ steps.plan.outputs.source_tag }}
        run: |
          if manifest=$(docker buildx imagetools inspect "$IMAGE:$SOURCE_TAG" --format '{{json .Manifest}}'); then
            digest=$(jq -er '.digest | select(test("^sha256:[a-f0-9]{64}$"))' <<< "$manifest")
            echo "source=$IMAGE@$digest" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::Previous image is unavailable; rebuilding this component."
          fi

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ steps.owner.outputs.name }}/caimack-${{ matrix.name }}
          flavor: latest=auto
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha

      - name: Publish release tags for the unchanged image
        if: steps.reuse.outputs.source != ''
        env:
          SOURCE_IMAGE: ${{ steps.reuse.outputs.source }}
          IMAGE_METADATA: ${{ steps.meta.outputs.json }}
        run: |
          args=()
          while IFS= read -r tag; do
            args+=(--tag "$tag")
          done < <(jq -er '.tags[]' <<< "$IMAGE_METADATA")
          docker buildx imagetools create --prefer-index=false "${args[@]}" "$SOURCE_IMAGE"
          echo "Reused $SOURCE_IMAGE" >> "$GITHUB_STEP_SUMMARY"

      - name: Build and publish the changed or missing image
        if: steps.reuse.outputs.source == ''
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.file }}
          target: ${{ matrix.target }}
          build-contexts: ${{ matrix.contexts }}
          build-args: |
            CAIMACK_SOURCE_URL=https://github.com/${{ github.repository }}/tree/${{ github.sha }}
            ${{ matrix.build_args }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}
