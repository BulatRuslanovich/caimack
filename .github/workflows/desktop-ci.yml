name: Desktop client

on:
  pull_request:
    paths:
      - "desktop/**"
      - "frontend/**"
      - "android/app/src/main/res/font/**"
      - ".github/workflows/desktop-ci.yml"
  push:
    branches: [master]
    tags: ["v*"]
    paths:
      - "desktop/**"
      - "frontend/**"
      - "android/app/src/main/res/font/**"
      - ".github/workflows/desktop-ci.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            platform: linux
          - os: windows-2025
            platform: windows
    runs-on: ${{ matrix.os }}
    timeout-minutes: 35
    env:
      CAIMACK_SOURCE_URL: https://github.com/${{ github.repository }}/tree/${{ github.sha }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: |
            frontend/package-lock.json
            desktop/package-lock.json

      - run: npm ci --prefix frontend --no-audit --no-fund
      - run: npm ci --prefix desktop --no-audit --no-fund
      - run: npm test --prefix desktop
      - run: npm run dist:${{ matrix.platform }} --prefix desktop

      - name: Verify Linux packages
        if: matrix.platform == 'linux'
        shell: bash
        run: |
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          cd desktop
          npm run test:smoke -- release/*.AppImage
          dpkg-deb --extract release/*.deb "$RUNNER_TEMP/caimack-deb"
          npm run test:smoke -- "$(find "$RUNNER_TEMP/caimack-deb" -type f -name caimack -print -quit)"
          docker run --rm -u "$(id -u):$(id -g)" -v "$PWD/release/arch:/package" -w /package \
            archlinux:base-devel bash -c 'makepkg --nodeps --noconfirm && makepkg --printsrcinfo > .SRCINFO'
          mkdir "$RUNNER_TEMP/caimack-arch"
          tar -xf release/arch/*.pkg.tar.zst -C "$RUNNER_TEMP/caimack-arch"
          npm run test:smoke -- "$RUNNER_TEMP/caimack-arch/opt/caimack-desktop/caimack"

      - name: Verify Windows installer and portable executable
        if: matrix.platform == 'windows'
        shell: pwsh
        working-directory: desktop
        run: |
          $installer = Get-ChildItem release -Filter '*-setup.exe' | Select-Object -First 1
          $portable = Get-ChildItem release -Filter '*-portable.exe' | Select-Object -First 1
          $installed = Join-Path $env:RUNNER_TEMP 'caimack-installed'
          $process = Start-Process -FilePath $installer.FullName -ArgumentList '/S', "/D=$installed" -PassThru -Wait
          if ($process.ExitCode -ne 0) { throw "NSIS failed with exit code $($process.ExitCode)" }
          npm run test:smoke -- (Join-Path $installed 'caimack.exe')
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          npm run test:smoke -- $portable.FullName --portable
          exit $LASTEXITCODE

      - uses: actions/upload-artifact@v7
        with:
          name: caimack-desktop-${{ matrix.platform }}-x64
          if-no-files-found: error
          path: |
            desktop/release/*.AppImage
            desktop/release/*.deb
            desktop/release/*-setup.exe
            desktop/release/*-portable.exe
            desktop/release/arch/*.pkg.tar.zst
            desktop/release/arch/*.tar.xz
            desktop/release/arch/PKGBUILD
            desktop/release/arch/.SRCINFO
            desktop/release/arch/caimack.desktop
            desktop/release/arch/caimack.png
          include-hidden-files: true
